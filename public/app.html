<!doctype html>
<html lang="pt">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script src="../js/head-loader.js"></script>
		<title>FaturAki - Gestor de Orçamentos</title>
		<!-- Tailwind CSS CDN -->
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<!-- global css -->
		<link rel="stylesheet" href="../css/style.css" />
		<!-- Google Fonts: Inter -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body
		class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-between p-4"
	>
		<!-- Container -->
		<div>
			<!-- Cabeçalho -->
			<header
				class="w-full max-w-md bg-white shadow-sm rounded-xl p-4 mb-4 text-center"
			>
				<h1 class="text-2xl font-bold text-blue-600">FaturAki</h1>
				<p class="text-xs text-slate-500">
					Cria e envia orçamentos rápidos via WhatsApp
				</p>
			</header>
			<!-- Conteúdo Principal / Formulário -->
			<main
				class="w-full max-w-md bg-white shadow-md rounded-xl p-5 flex flex-col gap-4"
			>
				<h2 class="text-lg font-semibold border-b pb-2">Novo Orçamento</h2>
				<p class="text-sm text-slate-400 text-center py-6">
					A preparar os campos do emissor e cliente...
				</p>
			</main>
		</div>

		<script src="script.js" defer></script>
	</body>
</html>
